<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GENIC - Inicializar Firestore</title>
<style>
  :root{--bg:#0f172a;--card:#1e293b;--accent:#ffc95c;--txt:#e2e8f0;--mut:#94a3b8;}
  *{box-sizing:border-box;font-family:system-ui,Segoe UI,Roboto,sans-serif;}
  body{margin:0;background:var(--bg);color:var(--txt);padding:20px;max-width:760px;margin:auto;}
  h1{color:var(--accent);font-size:1.3rem;}
  .card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:14px;}
  label{display:block;font-size:.8rem;color:var(--mut);margin:8px 0 4px;}
  input{width:100%;padding:10px;border-radius:8px;border:1px solid #334155;background:#0b1220;color:var(--txt);font-size:.95rem;}
  .row{display:flex;gap:10px;}.row>div{flex:1;}
  button{background:var(--accent);color:#3a2a00;font-weight:800;border:none;
         padding:12px 18px;border-radius:10px;font-size:1rem;cursor:pointer;margin:12px 8px 0 0;}
  button.sec{background:#334155;color:var(--txt);}
  button:disabled{opacity:.5;cursor:not-allowed;}
  pre{background:#0b1220;border:1px solid #334155;border-radius:10px;padding:12px;
      max-height:340px;overflow:auto;font-size:.82rem;white-space:pre-wrap;}
  .ok{color:#6ee7b7;} .bad{color:#fca5a5;} .warn{color:var(--accent);} .mut{color:var(--mut);font-size:.9rem;}
  code{background:#0b1220;padding:2px 6px;border-radius:6px;}
</style>
</head>
<body>
  <h1>&#127827; GENIC &middot; Inicializar catálogo en Firestore</h1>
  <div class="card">
    <p class="mut">Crea <code>frutas</code> (13 frutas de exportación colombianas) y
    <code>etiquetas</code> (4 estados) vía la <b>API REST</b> de Firestore.</p>
    <div class="row">
      <div>
        <label>Project ID</label>
        <input id="proj" value="genic-76302">
      </div>
      <div>
        <label>Database ID (normalmente <code>(default)</code>)</label>
        <input id="dbid" value="(default)">
      </div>
    </div>
    <label>API key (web)</label>
    <input id="apikey" value="AIzaSyB1r3EcCmgLDwYv19v6T-ZxbhYbABtYlW4">
    <button id="btnTest" class="sec" onclick="probar()">Probar conexión</button>
    <button id="btn" onclick="crear()">Crear catálogo</button>
  </div>
  <div class="card"><pre id="log">1) Pulsa "Probar conexión".  2) Si sale OK, "Crear catálogo".</pre></div>

<script>
function base(){
  const p = document.getElementById('proj').value.trim();
  const d = document.getElementById('dbid').value.trim() || "(default)";
  return `https://firestore.googleapis.com/v1/projects/${p}/databases/${encodeURIComponent(d)}/documents`;
}
function apikey(){ return document.getElementById('apikey').value.trim(); }

const FRUTAS = [
  ["aguacate","Aguacate Hass","🥑",true],["banano","Banano","🍌",true],
  ["uchuva","Uchuva","🟠",true],["gulupa","Gulupa","🟣",true],
  ["maracuya","Maracuyá","🟡",true],["pitahaya","Pitahaya","🐉",true],
  ["granadilla","Granadilla","🟠",true],["mango","Mango","🥭",true],
  ["lima_tahiti","Lima Tahití","🍋",true],["pina","Piña","🍍",true],
  ["papaya","Papaya","🍈",true],["fresa","Fresa","🍓",false],
  ["arandano","Arándano","🫐",false],
];
const ESTADOS = [
  ["sana","Sana","#22c55e"],["botrytis","Botrytis","#a855f7"],
  ["antracnosis","Antracnosis","#f59e0b"],["podrida","Podrida","#ef4444"],
];

const logEl = document.getElementById('log');
function log(m,c){ logEl.innerHTML += `\n<span class="${c||''}">${m}</span>`; logEl.scrollTop = logEl.scrollHeight; }

function toFields(obj){
  const fields = {};
  for (const k in obj){
    const v = obj[k];
    if (typeof v === 'boolean')     fields[k] = { booleanValue: v };
    else if (typeof v === 'number') fields[k] = Number.isInteger(v) ? { integerValue: String(v) } : { doubleValue: v };
    else                            fields[k] = { stringValue: String(v) };
  }
  return { fields };
}
async function setDoc(col, id, obj){
  const url = `${base()}/${col}/${encodeURIComponent(id)}?key=${apikey()}`;
  const r = await fetch(url, { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify(toFields(obj)) });
  if (!r.ok){ throw new Error(`HTTP ${r.status} — ${(await r.text()).slice(0,220)}`); }
}

window.probar = async function(){
  logEl.textContent = 'Probando conexión...';
  try{
    const r = await fetch(`${base()}/frutas?key=${apikey()}&pageSize=1`);
    const txt = await r.text();
    if (r.ok){ log('✅ Conexión OK. Firestore responde. Ya puedes crear el catálogo.', 'ok'); return; }
    log(`⚠️ HTTP ${r.status}: ${txt.slice(0,260)}`, 'bad');
    if (txt.includes('does not exist')){
      log('\n👉 La base con ese Database ID no existe. Comprueba en la consola de', 'warn');
      log('   Google Cloud > Firestore el ID EXACTO (puede no ser "(default)")', 'warn');
      log('   y escríbelo arriba. Ruta: https://console.cloud.google.com/firestore/databases?project='+document.getElementById('proj').value.trim(), 'warn');
    } else if (txt.toLowerCase().includes('datastore')){
      log('\n👉 La base está en MODO DATASTORE (no compatible). Crea una en modo', 'warn');
      log('   Firestore Native desde la consola de Firebase.', 'warn');
    } else if (r.status===403){
      log('\n👉 403: revisa reglas de Firestore (modo prueba) o la API key.', 'warn');
    }
  }catch(e){ log('❌ Error de red: '+e.message, 'bad'); }
};

window.crear = async function(){
  const btn = document.getElementById('btn'); btn.disabled = true;
  logEl.textContent = 'Creando catálogo...';
  const ahora = new Date().toISOString();
  try{
    for (let i=0;i<FRUTAS.length;i++){
      const [id,nombre,emoji,exp] = FRUTAS[i];
      await setDoc('frutas', id, { nombre, emoji, exportacion:exp, activa:true, orden:i, n_mediciones:0, creado:ahora });
      log(`  [frutas] ${emoji} ${nombre}`, 'ok');
    }
    for (let i=0;i<ESTADOS.length;i++){
      const [id,nombre,color] = ESTADOS[i];
      await setDoc('etiquetas', id, { nombre, color, orden:i });
      log(`  [etiquetas] ${nombre}`, 'ok');
    }
    log(`\n✅ Listo: ${FRUTAS.length} frutas y ${ESTADOS.length} etiquetas creadas.`, 'ok');
  }catch(e){
    log(`\n❌ Error: ${e.message}`, 'bad');
    log('Pulsa "Probar conexión" para ver la causa exacta.', 'warn');
  }finally{ btn.disabled = false; }
};
</script>
</body>
</html>
